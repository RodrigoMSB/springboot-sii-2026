server:
  # `practica` en el 8089 y `solucion` en el 8090: pueden correr a la vez.
  port: 8089

spring:
  application:
    name: lab06-rendimiento

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        generate_statistics: true
    open-in-view: false

logging:
  level:
    root: WARN
    cl.dgt: INFO
    org.springframework.boot.tomcat: INFO
    # Hibernate imprime un resumen de estadísticas al cerrar si se le deja: no.
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN
