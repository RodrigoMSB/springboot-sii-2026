# =============================================================================
#  dgt-portal — lo MÍNIMO que una pieza necesita saber por sí misma
# -----------------------------------------------------------------------------
#  Tres cosas, y ninguna más:
#    1. cómo se llama            -> para que el Config Server sepa qué servirle
#    2. dónde está el Config Server
#    3. dónde está el registro
#
#  Todo lo demás —el puerto, las rutas, los tiempos— baja del Config Server. Si
#  aquí abajo aparece algún día una regla de negocio, alguien se equivocó de
#  archivo.
#
#  ⚠️  NO HAY bootstrap.yml, y no es un olvido.
#  Hasta Spring Boot 2.4 los clientes del Config Server usaban un `bootstrap.yml`
#  y una fase de arranque previa al contexto normal. Esa fase ya no está en el
#  camino por defecto: hoy se usa `spring.config.import`, que es la línea de
#  abajo. Si ves un tutorial con bootstrap.yml y `spring-cloud-starter-bootstrap`,
#  es material de hace cinco años.
# =============================================================================
spring:
  application:
    name: dgt-portal
  config:
    import: "configserver:${CONFIG_URL:http://localhost:8888}"
  cloud:
    config:
      # Si el Config Server no está, esta aplicación NO arranca. Es deliberado:
      # arrancar con la mitad de la configuración es peor que no arrancar — te
      # deja un servicio vivo comportándose de forma que nadie escribió.
      fail-fast: true
      retry:
        max-attempts: 20
        initial-interval: 1000
        max-interval: 3000

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${HOSTNAME:local}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
