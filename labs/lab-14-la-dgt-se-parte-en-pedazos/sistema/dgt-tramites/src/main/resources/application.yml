# =============================================================================
#  dgt-tramites — lo mínimo local. El resto baja del Config Server.
# -----------------------------------------------------------------------------
#  Y «el resto» incluye los umbrales del circuit breaker, que son el TODO de este
#  laboratorio: viven en config-repo/dgt-tramites.yml, no aquí.
# =============================================================================
spring:
  application:
    name: dgt-tramites
  config:
    import: "configserver:${CONFIG_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 20
        initial-interval: 1000
        max-interval: 3000

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${HOSTNAME:local}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
