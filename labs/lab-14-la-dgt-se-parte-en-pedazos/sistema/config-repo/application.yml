# =============================================================================
#  application.yml — lo que vale para TODOS los servicios del sistema
# -----------------------------------------------------------------------------
#  El Config Server sirve este archivo a cualquiera que le pregunte, sea quien
#  sea, y encima le añade el suyo propio (dgt-tramites.yml, dgt-portal.yml…).
#  Lo específico gana sobre lo común.
#
#  Este archivo es la respuesta a «el timeout está escrito en cinco sitios». Aquí
#  está escrito en uno. Cámbialo, reinicia los servicios, y cambió en los cinco.
#
#  ⚠️  Es también el sitio donde se ve el peligro de la configuración
#  centralizada: un error aquí no tumba un servicio, tumba SEIS. La contrapartida
#  de tener una sola fuente de verdad es que también hay un solo sitio donde
#  equivocarse para todos a la vez.
# =============================================================================

management:
  endpoints:
    web:
      exposure:
        # Lista blanca nominal, la del Lab 10. `*` deja `/env` y `/heapdump`
        # abiertos, y eso ya se pagó una vez en el Lab 02.
        # `circuitbreakers` y `circuitbreakerevents` los añade Resilience4j:
        # son la ventana para ver el estado del circuito sin leer un log.
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    circuitbreakers:
      enabled: true

logging:
  pattern:
    # El nombre del servicio en cada línea. Con seis procesos escribiendo a la
    # vez en `docker compose logs`, un log que no dice quién lo escribió no
    # sirve para nada.
    console: "%d{HH:mm:ss.SSS} [${spring.application.name:-}] %-5level %logger{36} - %msg%n"
  level:
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN

# =============================================================================
#  Los relojes de Eureka — bajados a propósito, y hay que saber por qué
# -----------------------------------------------------------------------------
#  Con los valores por DEFECTO, una instancia que muere sigue anotada en la guía
#  telefónica cerca de NOVENTA SEGUNDOS:
#
#      lease-renewal-interval          30 s   (cada cuánto dice «sigo vivo»)
#      lease-expiration-duration       90 s   (cuánto se espera antes de tacharla)
#      registry-fetch-interval         30 s   (cada cuánto el cliente relee la lista)
#      eviction-interval                60 s   (cada cuánto el servidor limpia)
#
#  Durante esa ventana, el LoadBalancer sigue mandando tráfico a un cadáver. Eso
#  no es un fallo de Eureka: es su diseño. Prefiere equivocarse por exceso —
#  seguir anunciando una instancia que quizá solo tuvo un corte de red— antes
#  que sacar de rotación a media flota por un hipo. Se llama disponibilidad sobre
#  consistencia, y es una decisión, no un descuido.
#
#  En una clase de tres horas, noventa segundos de espera son media actividad.
#  Aquí se bajan a ~15 s para que el bloque 3 quepa en la sesión.
#
#  ⚠️  NO copies estos números a producción sin pensar. Renovaciones cada 5 s por
#  cada instancia multiplicadas por trescientas instancias son tráfico y CPU en
#  el registro. Y la ventana nunca llega a cero: SIEMPRE existe un momento en
#  que la lista miente. Diseñar asumiendo que la lista es verdad es el error;
#  el circuit breaker y el reintento están precisamente para eso.
# =============================================================================
eureka:
  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
  client:
    registry-fetch-interval-seconds: 5
  # OJO: `eureka.server.*` NO va aquí. El registro es la única pieza que no pide
  # su configuración al Config Server (ver el comentario de su application.yml),
  # así que lo que se escriba aquí para el SERVIDOR de Eureka no le llega nunca.
  # Sus ajustes de servidor viven en dgt-registro/src/main/resources/application.yml.

# =============================================================================
#  La SEGUNDA caché — la que casi nadie recuerda
# -----------------------------------------------------------------------------
#  Entre «el registro sabe que existe una instancia nueva» y «tu servicio le
#  manda tráfico» hay DOS cachés, no una:
#
#    1. la del cliente de Eureka  — se baja la lista cada `registry-fetch-interval`
#    2. la del LoadBalancer       — guarda ESA lista otros 35 s por defecto
#
#  Bajar solo la primera no sirve de nada: el balanceador sigue repartiendo con
#  la lista vieja. Se midió durante la construcción de este laboratorio — una
#  segunda instancia recién levantada tardaba más de medio minuto en recibir su
#  primera petición, con el registro mostrándola desde el primer segundo.
#
#  Es el fallo de razonamiento típico con las cachés: se optimiza la que se
#  conoce y se olvida la que hay detrás. Y el síntoma —«el registro la ve pero no
#  le llega tráfico»— parece un fallo del balanceador cuando es exactamente lo
#  que se le pidió que hiciera.
#
#  ⚠️  En producción, 35 s de caché es una buena idea: evita preguntar la lista en
#  cada petición. Aquí se baja a 5 s por el reloj de la clase, no porque el
#  default esté mal.
# =============================================================================
spring:
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
