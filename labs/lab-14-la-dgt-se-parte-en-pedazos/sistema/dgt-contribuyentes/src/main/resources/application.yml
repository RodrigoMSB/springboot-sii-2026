# =============================================================================
#  dgt-contribuyentes — lo mínimo local. El resto baja del Config Server.
# =============================================================================
spring:
  application:
    name: dgt-contribuyentes
  config:
    import: "configserver:${CONFIG_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 20
        initial-interval: 1000
        max-interval: 3000

eureka:
  instance:
    prefer-ip-address: true
    # El instance-id lleva el nombre del contenedor (${HOSTNAME}), y por eso en
    # el bloque 3 se puede ver a ojo cuál de las dos instancias respondió: ese
    # mismo valor viaja en el campo `atendidoPor` de cada respuesta.
    instance-id: ${spring.application.name}:${HOSTNAME:local}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
