# =============================================================================
#  dgt-config — el Config Server. También configuración local, por lo mismo:
#  la fuente de la verdad no puede pedirse la verdad a sí misma.
# =============================================================================
server:
  port: 8888

spring:
  application:
    name: dgt-config
  profiles:
    # -------------------------------------------------------------------------
    #  `native` = el backend son ARCHIVOS, no un repositorio Git.
    # -------------------------------------------------------------------------
    #  Decisión del PO (SPEC-020 §3). El alumno abre config-repo/ con su editor,
    #  cambia un número y lo ve tomar efecto. Sin red, sin credenciales de Git,
    #  sin un repo que clonar antes de empezar.
    #
    #  En PRODUCCIÓN el backend es Git, y por dos razones concretas:
    #    · historial — quién subió el timeout a 30 s y en qué fecha;
    #    · reversión — `git revert` sobre el cambio de configuración que tumbó
    #      el sistema, sin recompilar ni redesplegar nada.
    #  Es el mismo Config Server con otro `spring.cloud.config.server.*`.
    active: native
  cloud:
    config:
      server:
        native:
          # Montado como volumen por el compose. Fuera de Docker, apunta a la
          # carpeta del repositorio del laboratorio.
          search-locations: ${CONFIG_REPO:file:./config-repo}

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${HOSTNAME:local}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
