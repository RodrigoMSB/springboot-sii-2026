server:
  # `practica` en el 8087 y `solucion` en el 8088: pueden correr a la vez.
  port: 8088

spring:
  application:
    name: lab04-relaciones-solucion

  jpa:
    hibernate:
      # La tabla la manda Flyway. Hibernate solo COMPRUEBA que la clase y la
      # tabla dicen lo mismo: si te falta una columna, falla al arrancar.
      ddl-auto: validate
    # Lo más importante del laboratorio: el SQL que Hibernate escribe por ti.
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

logging:
  level:
    root: WARN
    cl.dgt: INFO
    org.springframework.boot.tomcat: INFO
