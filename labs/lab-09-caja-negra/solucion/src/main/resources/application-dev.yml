# =============================================================================
#  Perfil dev — tu portátil
# -----------------------------------------------------------------------------
#  Boot levanta el compose.yaml y cablea el DataSource solo. Tú no escribes
#  ninguna cadena de conexión, y por tanto no hay ninguna que filtrar.
#
#  La credencial de laboratorio vive en compose.yaml, versionada a propósito:
#  abre una base desechable que muere con `docker compose down -v`.
# =============================================================================
spring:
  docker:
    compose:
      enabled: true
      lifecycle-management: start_and_stop

# El secreto de firma del JWT. Default de UTILERÍA solo en dev, como la credencial del
# compose.yaml: abre una base de juguete, no firma nada de producción. En prod NO hay
# default (ver application-prod.yml y VerificadorDeSecretosProd): la variable es obligatoria.
dgt:
  jwt:
    secret: ${DGT_JWT_SECRET:clave-de-laboratorio-hs256-no-usar-en-produccion-2026}
