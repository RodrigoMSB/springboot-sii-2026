# =============================================================================
#  compose.yaml — PostgreSQL local de la DGT
# -----------------------------------------------------------------------------
#  Boot levanta este compose solo (spring-boot-docker-compose) y cablea el
#  DataSource. El alumno JAMÁS escribe una cadena de conexión.
#
#  ⚠️  NOTA DEL PECADO ORIGINAL — léela antes de acusarnos de hipócritas.
#
#  La contraseña de abajo (`dgt-dev`) está versionada A PROPÓSITO. Es una
#  credencial de LABORATORIO, para una base DESECHABLE que solo existe en el
#  portátil del alumno y muere con `docker compose down -v`. Versionarla es lo
#  correcto: hace el entorno reproducible y no protege nada que valga proteger.
#
#  El crimen del Lab 01 es OTRO: credenciales de PRODUCCIÓN en `application.yml`,
#  que viajan al repo, al CI y al historial de git para siempre. Por eso
#  `application.yml` no contiene ninguna credencial (D-012).
#
#  La diferencia no es el archivo. Es qué protege el secreto y qué pasa si se
#  filtra. Enseñar esa distinción es el punto del Lab 01.
#
#  Tag con patch fijado (nunca `:16` ni `:latest`): la reproducibilidad es
#  parte del contenido. Verificado vigente en Docker Hub al 2026-07-09.
# =============================================================================
services:
  postgres:
    image: postgres:16-alpine3.24
    environment:
      POSTGRES_DB: dgt
      POSTGRES_USER: dgt
      POSTGRES_PASSWORD: dgt-dev      # credencial de laboratorio — ver nota arriba
    ports:
      # Puerto de host EFÍMERO, no "5432:5432". Boot descubre el puerto publicado y
      # cablea el DataSource solo. Un puerto fijo revienta en cuanto el alumno ya
      # tiene un PostgreSQL escuchando en 5432 — y muchos lo tienen.
      #   ¿A qué puerto quedó?  docker compose port postgres 5432
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dgt -d dgt"]
      interval: 2s
      timeout: 3s
      retries: 15

  # ---------------------------------------------------------------------------
  #  TESO — Tesorería, el servicio externo que confirma pagos (D-002).
  # ---------------------------------------------------------------------------
  #  Es un WireMock: un doble de TESO que responde lo que le digamos. Sus
  #  respuestas viven versionadas en ./teso-mappings (reproducibles). El puerto
  #  de host es FIJO (8089) para que la app y el `--teso-lento` lo encuentren sin
  #  adivinar; si lo tienes ocupado, cámbialo aquí y en application-dev.yml.
  #
  #  Tag con patch fijado (nunca :latest): reproducibilidad. Verificado vigente.
  teso:
    image: wiremock/wiremock:3.9.1
    command: ["--disable-banner", "--local-response-templating"]
    ports:
      - "8089:8080"
    volumes:
      - ./teso-mappings:/home/wiremock/mappings:ro

  # ---------------------------------------------------------------------------
  #  RabbitMQ — el amortiguador entre la DGT y el servicio de avisos (M11).
  # ---------------------------------------------------------------------------
  #  La imagen `-management` trae la consola web (http://localhost:15672,
  #  dgt / dgt-dev). No es un lujo: en este lab hay que MIRAR la cola —cuántos
  #  mensajes esperan, cuáles cayeron a la DLQ y con qué causa—, y verlo en una
  #  pantalla enseña más que leerlo en un log.
  #
  #  Tag con patch fijado (nunca `:4` ni `:latest`): la reproducibilidad es parte
  #  del contenido, igual que con postgres y wiremock. Verificado vigente en
  #  Docker Hub con `docker manifest inspect`.
  #
  #  El puerto AMQP (5672) se publica EFÍMERO, como el de PostgreSQL: quien ya
  #  tenga un RabbitMQ en su máquina no choca. El de la consola sí es fijo, para
  #  que la URL de la guía no cambie en cada arranque.
  rabbitmq:
    image: rabbitmq:4.2.4-management
    environment:
      RABBITMQ_DEFAULT_USER: dgt
      RABBITMQ_DEFAULT_PASS: dgt-dev      # credencial de laboratorio — ver la nota de arriba
    ports:
      - "5672"          # AMQP, puerto efímero
      - "15672:15672"   # consola de administración
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
