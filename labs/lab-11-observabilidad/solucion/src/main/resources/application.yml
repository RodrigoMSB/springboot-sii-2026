server:
  # `practica` en el 8101 y `solucion` en el 8102.
  port: 8102

spring:
  application:
    name: lab11-observabilidad-solucion

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

lab11:
  base:
    puerto: 55443

management:
  endpoints:
    web:
      exposure:
        # Lista blanca NOMINAL. El paso 1 explica por qué no va `*`.
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        # Enciende /actuator/health/liveness y /actuator/health/readiness.
        enabled: true
      group:
        # LA DECISIÓN DEL PASO 3: la base entra en readiness, NO en liveness.
        # Sin la base no se puede atender (sacar de rotación); reiniciar el
        # proceso no la arregla.
        readiness:
          include: readinessState,baseDeDatos
        liveness:
          include: livenessState
  health:
    # El health propio entra en readiness (sacar de rotación), NO en liveness
    # (reiniciar). Es la decisión del paso 3.
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  info:
    env:
      enabled: true

info:
  curso: Spring Boot SII 2026
  lab: 11 — Observabilidad

logging:
  # Logging estructurado nativo de Spring Boot 4: sin dependencias. Se enciende
  # cambiando esto a `ecs`; se deja apagado porque en pantalla el JSON es ilegible.
  structured:
    format:
      console:
  level:
    root: WARN
    cl.dgt: INFO
    org.springframework.boot.tomcat: INFO
    org.flywaydb: INFO
  pattern:
    # El traceId del MDC, en cada línea. Paso 2.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-........}] %logger{25} - %msg%n"
