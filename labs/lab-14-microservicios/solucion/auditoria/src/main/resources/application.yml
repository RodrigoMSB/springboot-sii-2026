server:
  port: 8213

spring:
  application:
    name: lab14-auditoria-solucion

  datasource:
    url: jdbc:postgresql://localhost:55462/postgres
    username: postgres
    hikari:
      connection-timeout: 2000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    locations: classpath:db/migration

logging:
  level:
    root: WARN
    cl.dgt: INFO
    org.springframework.boot.tomcat: INFO
    org.flywaydb: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-........}] AUDITORIA - %msg%n"
