# =============================================================================
#  Perfil dev — tu portátil
# -----------------------------------------------------------------------------
#  Fíjate en lo que NO hay aquí: ninguna cadena de conexión. La base de datos la
#  levanta BaseDeDatosEmbebida — PostgreSQL de verdad, empaquetado como una
#  dependencia Maven más y corriendo como proceso hijo. Tú no escribes url,
#  usuario ni contraseña aquí, y por tanto no hay ninguna que filtrar.
#
#  PROVISORIO SPEC-022: rediseño en Fase 1.
#
#  TODO_1 y TODO_2 — te faltan dos perfiles hermanos de este:
#
#    application-test.yml  · para la suite: apaga la base embebida del perfil dev
#                            (`dgt.base-embebida.enabled: false`), porque los
#                            tests levantan la suya y la cablean solos.
#    application-prod.yml  · para el servidor: la conexión llega por VARIABLES DE
#                            ENTORNO, con placeholders ${DGT_DB_URL} y sin valores
#                            por defecto.
#
#  Pista 2: un `${VAR}` sin `:valor` no admite omisiones. Un `${VAR:algo}` sí, y
#  por eso es peligroso: arranca en silencio contra la base equivocada.
# =============================================================================
dgt:
  base-embebida:
    enabled: true

# -----------------------------------------------------------------------------
#  A qué interfaz se ata la aplicación
# -----------------------------------------------------------------------------
#  `localhost` y no todas las interfaces. Sin esto, Tomcat se ata a 0.0.0.0 y
#  Windows saca el cartel del Firewall —«Windows Defender ha bloqueado algunas
#  características de esta aplicación»— pidiendo permiso de administrador que el
#  alumno de una máquina corporativa no tiene. Un cartel que no puede aceptar, en
#  el primer minuto de clase (SPEC-024 · A2.3).
#
#  No se pierde nada: el laboratorio se usa desde la propia máquina. Y de paso la
#  app deja de estar publicada en la red de la institución, que tampoco es malo.
server:
  address: localhost
