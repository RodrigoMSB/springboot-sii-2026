# =============================================================================
#  application.yml — configuración común de dgt-tramites-api
# -----------------------------------------------------------------------------
#  Este archivo está "limpio". No hay ninguna contraseña aquí.
#
#  Antes sí la había. Alguien la borró en un commit. Míralo tú:
#      git log --oneline -- src/main/resources/application.yml
#      git show <el commit "ajustes de conexión">
#
#  Y ahora pregúntate lo que te va a preguntar Carolina:
#  ¿borrarla arregló algo?
# =============================================================================
spring:
  application:
    name: dgt-tramites-api

  profiles:
    active: ${DGT_PERFIL:dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

# Configuración propia de la DGT.
#
# TODO_3 — hoy la lee SelloService con @Value, uno por uno, sin tipos ni validación.
# Vas a reemplazarlo por un record tipado. Mira config/DgtProperties.java.
dgt:
  institucion: Dirección General de Tributación
  folio:
    prefijo: DGT
    largo: 8

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    cl.dgt.tramites: INFO
