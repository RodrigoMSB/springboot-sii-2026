# =============================================================================
#  application.yml — configuración común de dgt-tramites-api
# -----------------------------------------------------------------------------
#  Lo dejó el practicante el viernes. Compila, arranca y responde.
#
#  Baja hasta el final del archivo antes de seguir leyendo.
# =============================================================================
spring:
  application:
    name: dgt-tramites-api

  profiles:
    active: ${DGT_PERFIL:dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

# Configuración propia de la DGT.
#
# TODO_3 — hoy la lee SelloService con @Value, uno por uno, sin tipos ni validación.
# Vas a reemplazarlo por un record tipado. Mira config/DgtProperties.java.
dgt:
  institucion: Dirección General de Tributación
  folio:
    prefijo: DGT
    largo: 8

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    cl.dgt.tramites: INFO

# =============================================================================
#  ⬇️  EL CRIMEN
# -----------------------------------------------------------------------------
#  Esto es un segundo documento YAML dentro del mismo archivo: el `---` de abajo
#  lo separa, y `spring.config.activate.on-profile` hace que solo se aplique en
#  el perfil `prod`. Por eso tu `dev` arranca sin enterarse — y por eso nadie lo
#  vio en la revisión.
#
#  Léelo despacio. Eso es la URL, el usuario y la contraseña de la base de datos
#  de PRODUCCIÓN de la DGT, escritas a mano, en un archivo que está dentro del
#  repositorio que clonaron dieciocho personas.
#
#  TODO_1 — sácalas de aquí. Este bloque entero se va a `application-prod.yml`,
#  y los tres valores se piden al ENTORNO con `${...}` y sin valor por defecto.
#  El test T1 vigila las dos mitades: que no quede la credencial en ningún
#  recurso versionado, y que el perfil prod use marcadores sin defecto.
#
#  ⚠️  Es una credencial DE UTILERÍA: `prod-db.dgt.gob.cl` no existe y esa clave
#  no abre nada. Está plantada para que aprendas a reconocer el problema.
# =============================================================================
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://prod-db.dgt.gob.cl:5432/dgt
    username: dgt_app
    password: Dgt2026Pr0d!
