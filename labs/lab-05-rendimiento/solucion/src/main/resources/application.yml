server:
  # `practica` en el 8089 y `solucion` en el 8090: pueden correr a la vez.
  port: 8090

spring:
  application:
    name: lab05-rendimiento-solucion

  jpa:
    hibernate:
      ddl-auto: validate
    # APAGADO a propósito. La demo 1 dispara 201 consultas: con show-sql
    # encendido serían mil líneas de SQL y el número se perdería entre ellas.
    # Hoy no se lee el SQL —eso fue el Lab 04—, hoy se cuenta.
    show-sql: false
    properties:
      hibernate:
        # Esto es lo que enciende el contador. Sin esta línea,
        # ContadorDeConsultas devolvería siempre 0.
        generate_statistics: true
    open-in-view: false

logging:
  level:
    root: WARN
    cl.dgt: INFO
    org.springframework.boot.tomcat: INFO
    # Hibernate imprime un resumen de estadísticas al cerrar si se le deja: no.
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN
