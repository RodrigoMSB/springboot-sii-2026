# =============================================================================
#  Lab 3b — configuración
# -----------------------------------------------------------------------------
#  Fíjate en lo que NO hay: ninguna cadena de conexión. Ni url, ni usuario, ni
#  contraseña. La base la levanta Lab03bApplication como proceso hijo (Zonky) y
#  entrega su DataSource ya construido, así que Spring no tiene que fabricarlo a
#  partir de propiedades.
# =============================================================================

server:
  # El puerto HTTP de los endpoints del paso 10. `practica` usa el 8099, así que
  # los dos proyectos pueden estar arriba a la vez.
  port: 8100

spring:
  application:
    # El nombre entre corchetes de cada línea de log.
    name: lab03b-jpa

  jpa:
    # -------------------------------------------------------------------------
    #  LO IMPORTANTE DE ESTE ARCHIVO.
    #
    #  Imprime en la consola cada sentencia que Hibernate manda a la base. Todo
    #  el laboratorio consiste en escribir cero líneas de SQL y ver el SQL que
    #  aparece igual; con esto en `false` no se vería nada y el lab se quedaría
    #  sin su lección.
    #
    #  En el Lab 06 se apagará a propósito: allí una demo dispara 201 consultas
    #  y el SQL enterraría el número, que es lo que se mide.
    # -------------------------------------------------------------------------
    show-sql: true

    properties:
      hibernate:
        # Sin esto el SQL sale en una sola línea larguísima. Con esto sale
        # indentado y se puede leer en clase, que es de lo que se trata.
        format_sql: true

    hibernate:
      # -----------------------------------------------------------------------
      #  Quién crea la tabla: Flyway, en V1__observacion.sql. Hibernate solo
      #  COMPRUEBA que la entidad y la tabla digan lo mismo, y si no cuadran la
      #  aplicación no arranca — que es exactamente lo que se quiere.
      #
      #  `create-drop` la crearía a partir de la clase y la borraría al apagar.
      #  Cómodo para empezar, y justo lo contrario de lo que enseña este lab: la
      #  base persiste, y el paso 9 lo comprueba apagando y volviendo a arrancar.
      # -----------------------------------------------------------------------
      ddl-auto: validate

  flyway:
    # Dónde buscar las migraciones. Es el valor por defecto, escrito para que se
    # vea de dónde sale el V1 sin tener que saberlo de memoria.
    locations: classpath:db/migration

logging:
  level:
    # El ruido de arranque, al mínimo: en la consola tiene que verse el SQL, no
    # doscientas líneas de Spring, Hibernate y el arranque de PostgreSQL.
    root: WARN

    # Lo que imprimen las demos y las líneas «Starting»/«Started».
    cl.dgt.jpa: INFO

    # Flyway sí habla: dice qué migración aplicó y cuál se saltó por estar ya
    # puesta. Es la prueba en pantalla de que la base sobrevivió al apagado.
    org.flywaydb: INFO
