server:
  # `practica` en el 8110 y `solucion` en el 8111: pueden correr a la vez.
  port: 8111

spring:
  application:
    name: lab05b-muchos-a-muchos-solucion

  jpa:
    hibernate:
      # Las tres tablas las manda Flyway. Hibernate solo COMPRUEBA que las clases
      # y las tablas dicen lo mismo — y aquí comprueba también la intermedia.
      ddl-auto: validate
    # Lo primero que hay que mirar hoy: los INSERT y DELETE de la tabla intermedia.
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Esto es lo que enciende el contador del paso 4. Sin esta línea,
        # ContadorDeSentencias devolvería siempre 0.
        generate_statistics: true
    open-in-view: false

logging:
  level:
    root: WARN
    cl.dgt: INFO
    org.springframework.boot.tomcat: INFO
    # Hibernate imprime un resumen de estadísticas al cerrar si se le deja: no.
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN
