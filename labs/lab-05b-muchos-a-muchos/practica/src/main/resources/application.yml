server:
  # `practica` en el 8110 y `solucion` en el 8111: pueden correr a la vez.
  port: 8110

spring:
  application:
    name: lab05b-muchos-a-muchos

  jpa:
    hibernate:
      ddl-auto: validate
    # Lo primero que hay que mirar hoy: los INSERT y DELETE de la tabla intermedia.
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Esto es lo que enciende el contador del paso 4.
        generate_statistics: true
    open-in-view: false

logging:
  level:
    root: WARN
    cl.dgt: INFO
    org.springframework.boot.tomcat: INFO
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN
