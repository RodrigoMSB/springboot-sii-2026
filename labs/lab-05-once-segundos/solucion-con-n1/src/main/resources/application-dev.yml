# =============================================================================
#  Perfil dev — tu portátil
# -----------------------------------------------------------------------------
#  Boot levanta el compose.yaml y cablea el DataSource solo. Tú no escribes
#  ninguna cadena de conexión, y por tanto no hay ninguna que filtrar.
#
#  La credencial de laboratorio vive en compose.yaml, versionada a propósito:
#  abre una base desechable que muere con `docker compose down -v`.
# =============================================================================
spring:
  docker:
    compose:
      enabled: true
      lifecycle-management: start_and_stop
