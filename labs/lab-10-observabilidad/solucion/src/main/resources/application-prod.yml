# =============================================================================
#  Perfil prod — el servidor de la DGT
# -----------------------------------------------------------------------------
#  Los tres valores llegan por VARIABLE DE ENTORNO. Ninguno tiene valor por
#  defecto, y eso es deliberado: `${DGT_DB_PASSWORD}` sin `:` no admite
#  omisiones. Si falta, la aplicación NO ARRANCA y dice cuál falta.
#
#  Compáralo con `${DGT_DB_PASSWORD:cambiame}`: eso arranca en silencio, se
#  conecta a la base equivocada o a ninguna, y el error aparece un martes a las
#  tres de la mañana. Fallar rápido y fuerte es una decisión de diseño.
# =============================================================================
spring:
  docker:
    compose:
      enabled: false

  datasource:
    url: ${DGT_DB_URL}
    username: ${DGT_DB_USER}
    password: ${DGT_DB_PASSWORD}

  flyway:
    # En producción las migraciones las aplica el pipeline, no la app al arrancar.
    enabled: false

  jpa:
    hibernate:
      ddl-auto: validate

  # El secreto del JWT llega por variable de entorno, sin default: si falta, la app NO
  # arranca (VerificadorDeSecretosProd lo exige, junto a las credenciales de la base).
dgt:
  jwt:
    secret: ${DGT_JWT_SECRET}

# =============================================================================
#  Actuator en PRODUCCIÓN — el tablero, con la puerta de servicio cerrada
# -----------------------------------------------------------------------------
#  TODO_3 · Aquí se aprieta lo que en dev está cómodo. Dos cambios, dos razones.
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        # La misma lista blanca que en común, repetida A PROPÓSITO en vez de heredada: este
        # archivo es el que audita el oficial de seguridad, y una lista blanca que hay que ir a
        # buscar a otro archivo no es una lista blanca, es un acertijo. Que se lea aquí, entero.
        include: health,info,metrics,prometheus
        # Redundante con el `include` —lo no incluido ya no se expone— y aun así explícito: el
        # día que alguien agregue un endpoint al include "solo para depurar un rato", el exclude
        # sigue en pie. Los cinturones baratos se ponen antes del viaje, no después.
        exclude: env,beans,heapdump,threaddump,configprops,loggers,mappings,shutdown
  endpoint:
    health:
      # En dev, `always`: el alumno necesita ver el detalle. En producción, el detalle de un
      # health cuenta qué motor corres, qué versión y qué componente se cayó — reconocimiento
      # gratis para quien mira desde afuera. `when-authorized` lo muestra solo a quien ya entró.
      show-details: when-authorized
      roles: FUNCIONARIO
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,baseDeDatos
  health:
    db:
      enabled: false   # el nuestro (baseDeDatos) hace el trabajo; ver application.yml
  metrics:
    tags:
      application: ${spring.application.name}
