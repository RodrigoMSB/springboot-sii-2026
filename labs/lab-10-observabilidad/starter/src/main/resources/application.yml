# =============================================================================
#  application.yml — configuración común de dgt-tramites-api
# -----------------------------------------------------------------------------
#  AQUÍ NO HAY CREDENCIALES. Ninguna. Ni de desarrollo ni de producción.
#
#  Lo que cambia entre entornos vive en `application-<perfil>.yml`, y lo que es
#  secreto vive FUERA del repositorio: en variables de entorno.
#
#  Si algún día vuelves a ver una contraseña en este archivo, mira antes de
#  borrarla: `git log -- src/main/resources/application.yml`. Borrarla no la
#  quita del historial. Hay que ROTARLA.
# =============================================================================
spring:
  application:
    name: dgt-tramites-api

  profiles:
    active: ${DGT_PERFIL:dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    hikari:
      # Pool de conexiones DELIBERADAMENTE pequeño en este lab: un pago @Transactional retiene
      # una conexión mientras espera a TESO. Sin timeout, ~6 pagos colgados agotan el pool y
      # cualquier consulta (el listado) se queda sin conexión: la API entera, secuestrada.
      maximum-pool-size: 5
      # Cuánto espera Hikari antes de rendirse pidiendo conexión. El default son 30 s, y ese
      # default convierte al health check en un inútil educado: con la base caída, /health tardaría
      # medio minuto en admitirlo, y para entonces el balanceador ya te mandó tráfico. Un semáforo
      # que tarda 30 s en ponerse en rojo no es un semáforo. 5 s: suficiente para no dar falsos
      # positivos en un arranque lento, poco para que la verdad llegue a tiempo.
      connection-timeout: 5000

# Configuración propia de la DGT. La lee DgtProperties: tipada y validada.
dgt:
  adjuntos:
    # Dónde se guardan los archivos subidos. Fuera del repo; en dev, un directorio temporal.
    dir: ${DGT_ADJUNTOS_DIR:${java.io.tmpdir}/dgt-adjuntos}
  teso:
    # URL del servicio de Tesorería. La define cada perfil (dev: el WireMock del compose;
    # test: el contenedor de Testcontainers). El default apunta al WireMock del compose (dev).
    base-url: ${DGT_TESO_URL:http://localhost:8089}
  institucion: Dirección General de Tributación
  folio:
    prefijo: DGT
    largo: 8

# =============================================================================
#  Actuator — el tablero
# -----------------------------------------------------------------------------
#  Esta configuración la dejó el practicante del semestre pasado. Funciona: la app
#  arranca, /actuator/health responde UP y el monitoreo está "verde".
#
#  Está entera mal, y el laboratorio de hoy es descubrir por qué.
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        # "Lo puse en * para no andar agregando endpoints uno por uno cada vez que
        #  necesito depurar algo. Total, está detrás del login." — el practicante
        #
        # TODO_3 · Mira qué hay realmente detrás de ese asterisco antes de creerle.
        include: "*"
  endpoint:
    health:
      show-details: always
      # TODO_1 · Aquí NO hay grupos declarados.
      #
      # Ojo, porque esto es más sutil de lo que parece: /actuator/health/liveness y
      # /actuator/health/readiness SÍ responden —Boot 4 activa las sondas por defecto—.
      # Lo que pasa es que readiness solo contiene `readinessState`, que es el estado
      # interno del ciclo de vida de la aplicación: "terminé de arrancar". No mira nada.
      #
      # Y eso es PEOR que si no existieran. Una sonda ausente al menos se nota: el
      # orquestador da error al configurarla. Una sonda presente, que alguien conectó al
      # balanceador, y que responde UP con la base muerta, es exactamente el adorno del
      # que habla Carolina. Compruébalo:
      #
      #   curl -s localhost:8099/actuator/health/readiness   ->  {"status":"UP"}
      #
      # …con PostgreSQL apagado y la API devolviendo 500 a todo el mundo.
  health:
    # "El chequeo de la base tiraba DOWN cada vez que Postgres tardaba en levantar y
    #  nos llenaba el canal de alertas los lunes. Lo apagué y se acabaron las alertas."
    #                                                              — el practicante
    #
    # Y tiene razón: se acabaron las alertas. También se acabaron las verdaderas.
    #
    # TODO_1 · Esta línea es el crimen del lab. Con ella, /actuator/health responde UP
    # mientras el proceso Java esté vivo, aunque PostgreSQL lleve una hora muerto y
    # todos los endpoints de negocio estén devolviendo 500.
    #
    # Vívelo antes de arreglarlo:   ./bin/start-lab.sh --db-caida
    db:
      enabled: false

logging:
  # TODO_2 · Log estructurado en JSON (formato ECS nativo de Boot 4). Cada línea es un objeto
  # con timestamp, nivel, logger, message, y —clave— el traceId del MDC. Un agregador (ELK,
  # Loki) lo indexa y lo consulta; un humano lo filtra por traceId. El texto plano no se indexa.
  structured:
    format:
      console: ecs
  level:
    cl.dgt.tramites: INFO

# Pool de hilos de Tomcat, DELIBERADAMENTE pequeño en este lab: hace VISIBLE la lección del
# secuestro. Con 10 hilos, bastan ~12 pagos colgados (sin timeout) para llenar el pool y
# tumbar la API entera. En producción el pool es grande; el crimen tarda más en aparecer,
# pero es el mismo crimen.
server:
  tomcat:
    threads:
      max: 10
