server:
  # `practica` en el 8091 y `solucion` en el 8092: pueden correr a la vez.
  port: 8092

spring:
  application:
    name: lab07-concurrencia-solucion

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

logging:
  level:
    root: WARN
    cl.dgt: INFO
    org.springframework.boot.tomcat: INFO

    # La demo 2 provoca trece choques contra la restricción única, y Hibernate
    # los avisa DOS veces por hilo: treinta líneas de WARN que tapan el informe,
    # que es lo único que hay que leer. El mensaje de la base no se pierde — la
    # demo lo imprime una vez, sacado de la excepción.
    org.hibernate.orm.jdbc.error: ERROR
