# =============================================================================
#  compose.yaml — PostgreSQL local de la DGT
# -----------------------------------------------------------------------------
#  Boot levanta este compose solo (spring-boot-docker-compose) y cablea el
#  DataSource. El alumno JAMÁS escribe una cadena de conexión.
#
#  ⚠️  NOTA DEL PECADO ORIGINAL — léela antes de acusarnos de hipócritas.
#
#  La contraseña de abajo (`dgt-dev`) está versionada A PROPÓSITO. Es una
#  credencial de LABORATORIO, para una base DESECHABLE que solo existe en el
#  portátil del alumno y muere con `docker compose down -v`. Versionarla es lo
#  correcto: hace el entorno reproducible y no protege nada que valga proteger.
#
#  El crimen del Lab 01 es OTRO: credenciales de PRODUCCIÓN en `application.yml`,
#  que quedan al alcance de cualquiera con acceso al proyecto y de todo servidor
#  que lo descargue. Por eso `application.yml` no contiene ninguna credencial
#  (D-012).
#
#  La diferencia no es el archivo. Es qué protege el secreto y qué pasa si se
#  filtra. Enseñar esa distinción es el punto del Lab 01.
#
#  Tag con patch fijado (nunca `:16` ni `:latest`): la reproducibilidad es
#  parte del contenido. Verificado vigente en Docker Hub al 2026-07-09.
# =============================================================================
services:
  postgres:
    image: postgres:16-alpine3.24
    environment:
      POSTGRES_DB: dgt
      POSTGRES_USER: dgt
      POSTGRES_PASSWORD: dgt-dev      # credencial de laboratorio — ver nota arriba
    ports:
      # Puerto de host EFÍMERO, no "5432:5432". Boot descubre el puerto publicado y
      # cablea el DataSource solo. Un puerto fijo revienta en cuanto el alumno ya
      # tiene un PostgreSQL escuchando en 5432 — y muchos lo tienen.
      #   ¿A qué puerto quedó?  docker compose port postgres 5432
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dgt -d dgt"]
      interval: 2s
      timeout: 3s
      retries: 15
