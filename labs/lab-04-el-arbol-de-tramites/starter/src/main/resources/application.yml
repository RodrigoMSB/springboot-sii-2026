# =============================================================================
#  application.yml — configuración común de dgt-tramites-api
# -----------------------------------------------------------------------------
#  AQUÍ NO HAY CREDENCIALES. Ninguna. Ni de desarrollo ni de producción.
#
#  Lo que cambia entre entornos vive en `application-<perfil>.yml`, y lo que es
#  secreto vive FUERA del repositorio: en variables de entorno.
#
#  Si algún día vuelves a ver una contraseña aquí, borrarla es el primer paso y
#  no es el importante: mientras estuvo escrita, cualquiera con acceso al
#  repositorio pudo copiarla, y nadie sabe quién lo hizo. Hay que ROTARLA.
# =============================================================================
spring:
  application:
    name: dgt-tramites-api

  profiles:
    active: ${DGT_PERFIL:dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

# Configuración propia de la DGT. La lee DgtProperties: tipada y validada.
dgt:
  institucion: Dirección General de Tributación
  folio:
    prefijo: DGT
    largo: 8

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    cl.dgt.tramites: INFO
    # El muro de JOINs del Lab 04 se ve aquí: cada consulta de Hibernate, a la vista.
    org.hibernate.SQL: DEBUG
