# =============================================================================
#  application.yml — configuración común de dgt-tramites-api
# -----------------------------------------------------------------------------
#  AQUÍ NO HAY CREDENCIALES. Ninguna. Ni de desarrollo ni de producción.
#
#  Lo que cambia entre entornos vive en `application-<perfil>.yml`, y lo que es
#  secreto vive FUERA del repositorio: en variables de entorno.
#
#  Si algún día vuelves a ver una contraseña aquí, borrarla es el primer paso y
#  no es el importante: mientras estuvo escrita, cualquiera con acceso al
#  repositorio pudo copiarla, y nadie sabe quién lo hizo. Hay que ROTARLA.
# =============================================================================
spring:
  application:
    name: dgt-tramites-api

  profiles:
    active: ${DGT_PERFIL:dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # ===========================================================================
  #  RabbitMQ — el amortiguador (M11)
  # ---------------------------------------------------------------------------
  #  El host y el puerto los cablea Boot desde el compose (spring-boot-docker-compose),
  #  igual que con PostgreSQL: el alumno no escribe una cadena de conexión.
  # ===========================================================================
  rabbitmq:
    listener:
      simple:
        # Cuántas veces se reintenta ANTES de rendirse. Acotado, y esa es la palabra.
        #
        # Un mensaje envenenado —un JSON corrupto, un contribuyente que ya no existe— no se arregla
        # esperando: fallará las mil veces. Reintentar sin tope es un bucle infinito que además
        # ATASCA la cola: los mensajes buenos que van detrás no se procesan nunca. Tres intentos
        # cubren el fallo transitorio (una desconexión, un bloqueo momentáneo) y descartan la
        # fantasía de que el veneno se cure solo.
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 200ms
          multiplier: 2.0
          max-interval: 2s
        # Y agotados los intentos, NO se devuelve a la cola: se rechaza.
        #
        # Esta línea es la que hace funcionar la DLQ. Con `true` (el default), el mensaje rechazado
        # vuelve al principio de la cola y empieza otra vez — el bucle infinito de manual, con el
        # agravante de que el x-dead-letter-exchange nunca llega a dispararse. Con `false`, el broker
        # lo considera muerto y lo enruta a la DLQ, donde un humano lo puede ver y decidir.
        default-requeue-rejected: false
        # Un consumidor por defecto: el orden importa poco aquí y la concurrencia complicaría el
        # laboratorio sin enseñar nada nuevo. En producción se sube, y ahí la idempotencia del
        # TODO_2 deja de ser una precaución y pasa a ser un requisito.
        concurrency: 1

  datasource:
    hikari:
      # Pool de conexiones DELIBERADAMENTE pequeño en este lab: un pago @Transactional retiene
      # una conexión mientras espera a TESO. Sin timeout, ~6 pagos colgados agotan el pool y
      # cualquier consulta (el listado) se queda sin conexión: la API entera, secuestrada.
      maximum-pool-size: 5
      # Cuánto espera Hikari antes de rendirse pidiendo conexión. El default son 30 s, y ese
      # default convierte al health check en un inútil educado: con la base caída, /health tardaría
      # medio minuto en admitirlo, y para entonces el balanceador ya te mandó tráfico. Un semáforo
      # que tarda 30 s en ponerse en rojo no es un semáforo. 5 s: suficiente para no dar falsos
      # positivos en un arranque lento, poco para que la verdad llegue a tiempo.
      connection-timeout: 5000

# Configuración propia de la DGT. La lee DgtProperties: tipada y validada.
dgt:
  adjuntos:
    # Dónde se guardan los archivos subidos. Fuera del repo; en dev, un directorio temporal.
    dir: ${DGT_ADJUNTOS_DIR:${java.io.tmpdir}/dgt-adjuntos}
  teso:
    # URL del servicio de Tesorería. La define cada perfil (dev: el WireMock del compose;
    # test: el contenedor de Testcontainers). El default apunta al WireMock del compose (dev).
    base-url: ${DGT_TESO_URL:http://localhost:8089}
  institucion: Dirección General de Tributación
  folio:
    prefijo: DGT
    largo: 8

  # Quién soy. Con una instancia es ruido; con dos, es lo que permite saber CUÁL hizo qué —en el
  # log, en la fila del cierre y en el candado—. El default sirve para el portátil; el
  # `--instancias 2` de start-lab.sh se lo sobreescribe a cada una.
  instancia: ${DGT_INSTANCIA:dgt-local}

  cierre:
    # El latido del cierre en el laboratorio. En producción esto sería el cron de las 3 AM; aquí
    # se acorta a segundos para que el crimen se vea en clase sin esperar a la noche.
    intervalo-ms: ${DGT_CIERRE_INTERVALO_MS:86400000}
    retardo-inicial-ms: ${DGT_CIERRE_RETARDO_MS:5000}
    # El cron de producción. La zona NO va aquí: va en la anotación, explícita (America/Santiago).
    cron: ${DGT_CIERRE_CRON:0 0 3 * * *}
    # Cuánto vale la toma del candado antes de expirar sola.
    #
    # Es EL compromiso del bloqueo distribuido, y hay que declararlo: demasiado corto y dos
    # instancias podrían solaparse si el cierre tarda más de la cuenta; demasiado largo y una
    # instancia que muere deja el cierre bloqueado ese rato. Se elige con holgura sobre la duración
    # real del trabajo —aquí, milisegundos— y se revisa cuando el volumen crezca.
    ttl-candado: ${DGT_CIERRE_TTL:PT2M}

# =============================================================================
#  Actuator — el tablero (M12)
# -----------------------------------------------------------------------------
#  Tres decisiones, y ninguna es "poner *".
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        # TODO_3 · Lista BLANCA, nominal. `*` expone también /env, /beans, /heapdump,
        # /configprops y /threaddump. /env vuelca TODA la configuración resuelta —incluidas las
        # variables de entorno, es decir el secreto del JWT y la clave de la base— y /heapdump
        # descarga la memoria del proceso, donde vive todo lo demás. No es una fuga hipotética:
        # es el crimen del Lab 01 otra vez, con otra puerta.
        #
        # Ojo con la distinción, que el TODO_3 mide: NO EXPUESTO no es lo mismo que CERRADO.
        #   · no expuesto  -> 404. El endpoint no existe. No hay nada que forzar.
        #   · cerrado      -> 401/403. Existe, y un token con el rol correcto lo abre.
        # La lista blanca hace lo primero. La seguridad del Lab 07 hace lo segundo. Se usan las
        # dos: en profundidad, no una en vez de la otra.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # El detalle es lo que convierte "algo se cayó" en "se cayó la base". Ver la nota de
      # application-prod.yml: en producción esto se restringe por rol, no se deja abierto.
      show-details: always
      # TODO_1 · Enciende los grupos `liveness` y `readiness` (y sus rutas
      # /actuator/health/liveness y /actuator/health/readiness) fuera de Kubernetes.
      probes:
        enabled: true
      group:
        # ¿Está VIVO el proceso? Si esto dice DOWN, la respuesta es REINICIAR.
        # Aquí NO entra la base: si la base se cae, reiniciar la app no la levanta — solo tira
        # el tráfico en curso y arranca un bucle de reinicios mientras el problema está en otra
        # máquina. Un liveness que mira dependencias externas convierte una caída de PostgreSQL
        # en una caída de PostgreSQL *más* un CrashLoopBackOff.
        liveness:
          include: livenessState
        # ¿Puede ATENDER? Si esto dice DOWN, la respuesta es NO MANDARLE TRÁFICO — y esperar.
        # Aquí sí entra la base: sin ella esta instancia no sirve un solo trámite.
        #
        # TESO no entra, y es una decisión, no un olvido: el Lab 08 le puso circuit breaker y
        # degradación elegante, así que la API SIGUE ATENDIENDO con TESO caído (los pagos
        # esperan; el resto funciona). Meter TESO en readiness sacaría de rotación a toda la
        # flota por un servicio del que ya aprendimos a no depender. Readiness es "¿puedo
        # atender?", no "¿está todo perfecto?".
        readiness:
          include: readinessState,baseDeDatos
  health:
    # Boot registra su propio indicador `db` al ver un DataSource. Lo apagamos porque escribimos
    # el nuestro (BaseDeDatosHealthIndicator): dos sondas a la misma base es ruido, y la nuestra
    # nombra el componente y adjunta la causa raíz. Verlo escrito a mano una vez es el punto del
    # TODO_1; en un proyecto real, con el de Boot basta y sobra.
    db:
      enabled: false
    # Y el de RabbitMQ, apagado por CRITERIO — el mismo del Lab 10 §5, aplicado a una dependencia
    # nueva. La pregunta de readiness es «¿puedo ATENDER?», no «¿está todo perfecto?».
    #
    # Con el broker caído, la DGT sigue atendiendo: se listan trámites, se consultan fichas, se
    # emiten folios. Lo único que no sale es el aviso — y para eso está justamente el trabajo de
    # este laboratorio. Marcar la instancia como no-apta la sacaría de rotación y tumbaría el
    # servicio ENTERO por una dependencia de la que acabamos de aprender a desacoplarnos. Sería
    # exactamente el error que no cometimos con TESO.
    #
    # Ojo con lo que esto NO significa: el broker caído sí es un problema, y hay que verlo. Pero se
    # ve en las MÉTRICAS (Lab 10) y en la DLQ, no sacando la instancia de servicio.
    rabbit:
      enabled: false
  # /actuator/prometheus etiqueta cada serie con la aplicación que la emite. Sin esto, dos
  # servicios distintos publican `dgt_folios_emitidos_total` y Prometheus los suma en silencio.
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  # TODO_2 · Log estructurado en JSON (formato ECS nativo de Boot 4). Cada línea es un objeto
  # con timestamp, nivel, logger, message, y —clave— el traceId del MDC. Un agregador (ELK,
  # Loki) lo indexa y lo consulta; un humano lo filtra por traceId. El texto plano no se indexa.
  structured:
    format:
      console: ecs
  level:
    cl.dgt.tramites: INFO

# Pool de hilos de Tomcat, DELIBERADAMENTE pequeño en este lab: hace VISIBLE la lección del
# secuestro. Con 10 hilos, bastan ~12 pagos colgados (sin timeout) para llenar el pool y
# tumbar la API entera. En producción el pool es grande; el crimen tarda más en aparecer,
# pero es el mismo crimen.
server:
  tomcat:
    threads:
      max: 10

# El planificador de tareas. CUATRO hilos, no uno, y es deliberado.
#
# El default de Spring es UNO, y ese uno esconde el bug del TODO_1: con un solo hilo, un `fixedRate`
# cuyo trabajo se alarga no puede solaparse — hace fila. Parece correcto, y no lo es: el día que
# alguien agregue una segunda tarea programada y suba el pool (que es lo que pasa siempre), las
# ejecuciones empiezan a pisarse y nadie relaciona el fallo nuevo con la configuración vieja.
#
# Aquí el pool es realista desde el principio, para que `fixedRate` vs `fixedDelay` sea una
# diferencia OBSERVABLE y no una nota al pie.
spring.task.scheduling.pool.size: 4
