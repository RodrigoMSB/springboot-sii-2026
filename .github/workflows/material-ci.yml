# =============================================================================
#  material-ci.yml — CI del MATERIAL del curso (tooling interno del repo)
# -----------------------------------------------------------------------------
#  Protege dos invariantes que el proyecto declara y que, hasta la SPEC-004,
#  solo vivían en la memoria de una conversación:
#
#   1. `temario` — la FUENTE (.md) y el BUILD (.docx) no divergen, y la matriz
#      Módulo × Sesión cuadra por las dos vías. Verificado por la SPEC-003 una
#      vez; nada impedía que la siguiente edición lo rompiera en silencio.
#   2. `siembra` — toda TEORIA.md de un lab con sucesor siembra el módulo N+1
#      (P-18 del ADN). Detección por PATRÓN, jamás por título literal: los labs
#      09-12 del curso de Cypress usan otro encabezado y son correctos.
#   3. `app` — el tronco compila, sus 7 guardianes vigilan y sus 7 mordidas se
#      certifican (SPEC-005).
#
#  ¿Por qué `pull_request` NO lleva filtro de rutas? (SPEC-FIX-01 §2)
#  Porque `main` exige estos tres checks para mergear. Con filtro, un PR que solo
#  tocara `docs/specs/` no dispararía ninguno y quedaría colgado para siempre
#  esperando un veredicto que nadie iba a emitir. El filtro era una trampa armada.
#  Se descartaron las alternativas: un job centinela no-op protege menos, y el
#  filtro fino por job no existe en Actions. Todo PR corre los tres jobs, siempre.
#  Cuesta ~1 minuto; un PR colgado cuesta más.
#
#  El evento `push` a `main` sí conserva filtros: es post-merge, ya no hay nada
#  que bloquear y ahorra runs.
# =============================================================================
name: material-ci

on:
  push:
    branches: [main]
    paths:
      - 'docs/temario/**'
      - 'tools/**'
      - 'labs/**'
      - 'dgt-tramites-api/**'
      - '.github/workflows/material-ci.yml'
  pull_request:            # sin `paths`: ver la cabecera. Ningún PR queda colgado.
  workflow_dispatch:       # para poder exigirle el verde a mano

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  #  Coherencia del temario: fuente <-> build, y la matriz que cuadra.
  # ---------------------------------------------------------------------------
  temario:
    name: temario · coherencia .md <-> .docx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # El verificador lee las CELDAS del .docx, no su texto renderizado
      # (lección D2 de la SPEC-003): por eso python-docx y no pandoc.
      - name: Instalar python-docx
        run: pip install --quiet python-docx

      - name: Verificar coherencia del temario
        run: python3 tools/verificar-temario.py

  # ---------------------------------------------------------------------------
  #  Regla de siembra (P-18). Armada hoy; se activa sola cuando nazca labs/.
  # ---------------------------------------------------------------------------
  siembra:
    name: siembra · toda TEORIA.md con sucesor siembra el módulo N+1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar la siembra
        shell: bash
        run: |
          set -euo pipefail

          # Solo los directorios `lab-NN-*`. `labs/lib/` es la caja de herramientas
          # compartida, no un laboratorio: si la contáramos, exigiríamos que tuviera
          # una TEORIA.md que siembre el módulo siguiente. Un filtro por convención
          # de nombre, no por "todo lo que cuelgue de labs/".
          LABS="$(find labs -maxdepth 1 -mindepth 1 -type d -name 'lab-*' | sort)"

          # Guarda de activación: sin labs, la regla queda armada, no activa.
          if [ -z "$LABS" ]; then
            echo "[INFO] Sin labs aún: la regla de siembra queda armada, no activa."
            exit 0
          fi

          # Sin `mapfile` ni `${a[-1]}`: bash 3.2 también corre esto (Git Bash,
          # macOS del instructor). El CI no es el único que debe poder ejecutarlo.
          #
          # `for` sobre IFS=nueva-línea, NO `... | while read`: un while tras una
          # tubería corre en subshell y perdería el contador FALLOS — el gate
          # saldría siempre verde. Es justo el "gate decorativo" que la rúbrica
          # del Lab 13 castiga (P-05 del ADN).
          ULTIMO="$(printf '%s\n' "$LABS" | tail -n 1)"
          FALLOS=0

          IFS=$'\n'
          for LAB in $LABS; do
            TEORIA="$LAB/TEORIA.md"

            # Exclusión documentada: el Lab 00 es pre-curso. No computa horas, no
            # tiene módulo, no tiene teoría — es el chequeo de la máquina del alumno
            # (SPEC-000 §9). Exigirle una siembra sería exigirle que enseñe algo.
            case "$LAB" in
              */lab-00-*)
                echo "[INFO] $LAB es pre-curso: exento de sembrar (no tiene teoría)."
                continue
                ;;
            esac

            # Exclusión por ESTRUCTURA, no por nombre: un lab de EXAMEN se
            # reconoce porque tiene rubrica/ y solucion-referencia/. No siembra
            # nada porque no enseña un módulo nuevo — mide los catorce anteriores.
            #
            # Hasta la SPEC-020 este caso lo cubría por accidente la regla del
            # ÚLTIMO lab: el examen era el último y quedaba exento sin decirlo. Al
            # nacer el Lab 14, el examen dejó de ser el último y esa exención se
            # evaporó en silencio. Sobrevivía solo porque su TEORIA.md contiene la
            # frase «este laboratorio NO siembra», que el `grep` de abajo da por
            # buena — un verde por casualidad, que es la peor clase de verde.
            # Aquí queda dicho a propósito.
            if [ -d "$LAB/rubrica" ] && [ -d "$LAB/solucion-referencia" ]; then
              echo "[INFO] $LAB es el EXAMEN de egreso: exento de sembrar (no enseña un módulo, los mide)."
              continue
            fi

            if [ "$LAB" = "$ULTIMO" ]; then
              # El último lab cierra el arco: no hay módulo N+1 que sembrar.
              echo "[INFO] $LAB es el último lab: exento de sembrar (cierra el arco)."
              continue
            fi

            if [ ! -f "$TEORIA" ]; then
              echo "[ERROR] $LAB no tiene TEORIA.md"
              FALLOS=$((FALLOS + 1))
              continue
            fi

            # Por PATRÓN, no por título literal (P-18): "siembra", sin distinguir
            # mayúsculas. Un lab puede titular su cierre como quiera.
            if grep -qi 'siembra' "$TEORIA"; then
              echo "[OK] $TEORIA siembra el módulo siguiente"
            else
              echo "[ERROR] $TEORIA no siembra el módulo siguiente (patrón 'siembra' ausente)"
              FALLOS=$((FALLOS + 1))
            fi
          done

          echo
          if [ "$FALLOS" -gt 0 ]; then
            echo "[ERROR] $FALLOS lab(s) sin siembra. Ver P-18 en docs/adn/adn-cypress.md."
            exit 1
          fi
          echo "[OK] Todos los labs con sucesor siembran el módulo N+1."

  # ---------------------------------------------------------------------------
  #  La app canónica: compila, sus 7 guardianes vigilan y sus 7 mordidas se
  #  certifican.
  #
  #  SOLO ubuntu-latest, y la exclusión de Windows va escrita aquí para que nadie
  #  la lea como un olvido ni la "arregle" rompiendo el CI:
  #
  #    `ContratoRn03IT` levanta PostgreSQL con Testcontainers, que necesita un
  #    demonio Docker con contenedores LINUX. Los runners `windows-latest`
  #    hospedados no lo ofrecen. Es la misma exclusión —y la misma razón— que el
  #    Lab 11 del curso de Cypress documenta en su matriz (P-12 del ADN).
  #
  #  El alumno Windows sí corre esto: su Docker Desktop con backend WSL2 levanta
  #  contenedores Linux. Lo que no existe es el runner, no el escenario.
  #  Si algún día hay tests sin Docker que valga la pena correr en Windows, se
  #  parte el job en dos: `app-sin-docker` (matriz de SO) y `app-it` (solo ubuntu).
  # ---------------------------------------------------------------------------
  app:
    name: app · dgt-tramites-api (verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dgt-tramites-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: ./mvnw verify
        run: ./mvnw -B verify

      - name: Las 7 reglas y las 7 mordidas corrieron
        run: |
          set -euo pipefail
          # Un verde no basta: hay que ver que la suite de arquitectura EXISTIÓ.
          # Un `verify` que no ejecuta a los guardianes es un gate decorativo (P-05).
          for suite in ArquitecturaTest MordidaDeLosGuardianesTest; do
            informe="target/surefire-reports/cl.dgt.tramites.arquitectura.$suite.txt"
            [ -f "$informe" ] || { echo "[ERROR] No se ejecutó $suite"; exit 1; }
            cat "$informe" | sed -n '4p'
            grep -q "Failures: 0, Errors: 0" "$informe" || { echo "[ERROR] $suite no está limpio"; exit 1; }
          done
          echo "[OK] Los 7 guardianes vigilan y los 7 muerden."

  # ---------------------------------------------------------------------------
  #  El sistema del Lab 14: cinco proyectos Maven que no son la app canónica.
  #
  #  El job `app` compila el tronco. Este compila lo OTRO: dgt-registro,
  #  dgt-config, dgt-portal, dgt-contribuyentes y dgt-tramites, que viven en
  #  labs/lab-14-*/sistema/ con su propio agregador y su propio release train de
  #  Spring Cloud. Sin este job, el día que ese tren o Boot cambien de versión,
  #  el Lab 14 se rompería en la máquina del alumno y en ningún sitio antes.
  #
  #  ---------------------------------------------------------------------------
  #  LO QUE ESTE JOB *NO* HACE, Y POR QUÉ — léelo antes de "arreglarlo"
  #  ---------------------------------------------------------------------------
  #  NO levanta las seis piezas en contenedores. La exclusión es deliberada:
  #
  #   · Son seis JVM más PostgreSQL. Medido en la construcción de la SPEC-020:
  #     1,54 GiB de RAM y 56 s de arranque en un portátil con caché caliente. En
  #     un runner hospedado, sin caché de imágenes, es varias veces eso.
  #   · Y sobre todo: un E2E de seis contenedores mide TIEMPOS de propagación
  #     entre cachés (Eureka + LoadBalancer). Eso, en un runner compartido y con
  #     la CPU en manos de otro, es una fábrica de fallos intermitentes. Un check
  #     que parpadea se acaba ignorando, y un check ignorado protege menos que
  #     ninguno.
  #
  #  Así que aquí se certifica lo DETERMINISTA —que compila, que los tests pasan,
  #  que el gate muerde, que no hay dependencias muertas— y el sistema en vivo se
  #  verifica a mano con `bin/start-lab.sh` y sus banderas, que es además donde el
  #  alumno lo va a ver. La evidencia de esa verificación está en el reporte de la
  #  SPEC-020, con sus milisegundos citados.
  #
  #  Si algún día hace falta el E2E en CI: job aparte, `continue-on-error: false`
  #  pero fuera de los checks requeridos, y con reintento. Nunca metido aquí.
  # ---------------------------------------------------------------------------
  lab14:
    name: lab14 · el sistema de microservicios (compila y su gate muerde)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/lab-14-la-dgt-se-parte-en-pedazos/sistema
    steps:
      - uses: actions/checkout@v4

      - name: Guarda de activación
        id: guarda
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          if [ -f labs/lab-14-la-dgt-se-parte-en-pedazos/sistema/pom.xml ]; then
            echo "hay=si" >> "$GITHUB_OUTPUT"
          else
            echo "[INFO] El Lab 14 aún no existe: el job queda armado, no activo."
            echo "hay=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.guarda.outputs.hay == 'si'
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Los cinco proyectos compilan sobre Boot 4.1.0 + Spring Cloud 2025.1.2
        if: steps.guarda.outputs.hay == 'si'
        run: ./mvnw -B -DskipTests package

      - name: La solución PASA el criterio de aceptación
        if: steps.guarda.outputs.hay == 'si'
        run: ./mvnw -B test -pl dgt-tramites -Ddgt.config-repo=../config-repo-solucion

      - name: El starter FALLA — si no, el enunciado no tiene ejercicio
        if: steps.guarda.outputs.hay == 'si'
        shell: bash
        run: |
          set -uo pipefail
          # El paso canónico de la SPEC-000 §7.6, aquí arriba: un starter que ya
          # aprueba es un enunciado sin hueco. Se comprueba que el validador diga
          # que NO, y se falla el job si dice que sí.
          if ./mvnw -B -q test -pl dgt-tramites -Ddgt.config-repo=../config-repo; then
            echo "[ERROR] El starter APRUEBA el criterio de aceptación."
            echo "        Alguien dejó los umbrales puestos en config-repo/dgt-tramites.yml."
            echo "        Sin hueco no hay laboratorio."
            exit 1
          fi
          echo "[OK] El starter falla, como debe: el hueco es real y el gate muerde."

      - name: Ninguna dependencia arrastra Hystrix, Ribbon ni Zuul
        if: steps.guarda.outputs.hay == 'si'
        shell: bash
        run: |
          set -euo pipefail
          # De todo el stack Netflix histórico solo Eureka sigue vivo en el tren
          # actual. Que reaparezca cualquiera de los otros significa que alguien
          # copió un tutorial caducado — y entonces media teoría de este lab deja
          # de ser cierta.
          ./mvnw -B -q dependency:tree -DoutputFile=/tmp/arbol.txt -DappendOutput=true
          # `-q`, no `-c`: con `-c` el propio grep imprime el número de coincidencias
          # ("0") en la salida del job, y un cero suelto en un log verde despista más
          # de lo que informa.
          if grep -qiE 'hystrix|:ribbon|zuul|archaius' /tmp/arbol.txt; then
            echo "[ERROR] El árbol de dependencias arrastra artefactos muertos:"
            grep -inE 'hystrix|:ribbon|zuul|archaius' /tmp/arbol.txt
            exit 1
          fi
          echo "[OK] Sin Hystrix, Ribbon, Zuul ni Archaius."

  # ---------------------------------------------------------------------------
  #  La demo de gRPC del Lab 08 (M10 del temario: «HTTP Declarativo Y gRPC»).
  #
  #  Es una demo del relator, no material del alumno: no tiene TODOs y no la mira
  #  ningún validador. Precisamente por eso necesita CI — nadie la corre en el día
  #  a día, así que se pudriría en silencio y el relator lo descubriría delante de
  #  la sala. Un `./mvnw test` aquí cuesta un minuto y lo hace imposible.
  #
  #  Genera stubs con `protoc` (binario nativo que descarga el plugin), así que es
  #  el único job que depende de una herramienta fuera del mundo Java. Si algún día
  #  esa descarga se vuelve inestable en el runner, el arreglo NO es borrar el job:
  #  es cachear el binario.
  # ---------------------------------------------------------------------------
  grpc:
    name: grpc · la demo del Lab 08 compila y responde
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/lab-08-diplomacia-con-tesoreria/demo-grpc
    steps:
      - uses: actions/checkout@v4

      - name: Guarda de activación
        id: guarda
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          if [ -f labs/lab-08-diplomacia-con-tesoreria/demo-grpc/pom.xml ]; then
            echo "hay=si" >> "$GITHUB_OUTPUT"
          else
            echo "[INFO] La demo de gRPC aún no existe: el job queda armado, no activo."
            echo "hay=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.guarda.outputs.hay == 'si'
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Los stubs se generan y el servicio responde a una llamada real
        if: steps.guarda.outputs.hay == 'si'
        run: ./mvnw -B test

  # ---------------------------------------------------------------------------
  #  El andamiaje de los labs: los scripts que el ALUMNO ejecuta.
  #
  #  Dos mitades, y la segunda importa tanto como la primera:
  #
  #   · ubuntu   -> `shellcheck -x`. La calidad real: variables sin comillas,
  #                 subshells que se tragan contadores, etc.
  #   · windows  -> `bash -n` (solo SINTAXIS). En windows-latest, `bash` ES Git
  #                 Bash: exactamente el entorno del alumno Windows.
  #
  #  LIMITACIÓN DECLARADA: en Windows NO se ejecutan los scripts, solo se
  #  comprueba que parsean. Levantar la app necesita PostgreSQL en un contenedor
  #  Linux, y los runners `windows-latest` hospedados no lo ofrecen (la misma
  #  razón por la que el job `app` es solo ubuntu). Garantizamos que el día que
  #  un alumno de Windows los corra, al menos no explotarán al leerse. El resto
  #  lo advierte labs/lab-00-estacion-base/docs/entorno-alumno.md, §3.
  # ---------------------------------------------------------------------------
  labs-sh:
    name: labs-sh · andamiaje (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Guarda de activación
        id: guarda
        shell: bash
        run: |
          set -euo pipefail
          # `find`, no globs: `labs/**/*.sh` sin globstar no baja más de un nivel.
          if [ -z "$(find labs -name '*.sh' 2>/dev/null)" ]; then
            echo "[INFO] Sin scripts en labs/ todavía: el job queda armado, no activo."
            echo "hay=no" >> "$GITHUB_OUTPUT"
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi

      - name: shellcheck (solo ubuntu)
        if: matrix.os == 'ubuntu-latest' && steps.guarda.outputs.hay == 'si'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fallos=0
          for f in $(find labs -name '*.sh' | sort); do
            if shellcheck -x "$f"; then
              echo "[OK] $f"
            else
              echo "[ERROR] $f"
              fallos=$((fallos + 1))
            fi
          done
          [ "$fallos" -eq 0 ] || { echo "[ERROR] $fallos script(s) con problemas"; exit 1; }
          echo "[OK] shellcheck limpio en todo el andamiaje."

      - name: bash -n · sintaxis en Git Bash (solo windows)
        if: matrix.os == 'windows-latest' && steps.guarda.outputs.hay == 'si'
        shell: bash
        run: |
          set -euo pipefail
          echo "[INFO] bash de este runner: $(bash --version | head -n 1)"
          fallos=0
          for f in $(find labs -name '*.sh' | sort); do
            if bash -n "$f"; then
              echo "[OK] $f parsea"
            else
              echo "[ERROR] $f NO parsea en Git Bash"
              fallos=$((fallos + 1))
            fi
          done
          [ "$fallos" -eq 0 ] || { echo "[ERROR] $fallos script(s) no parsean"; exit 1; }
          echo "[OK] Todo el andamiaje parsea en el bash del alumno Windows."
          echo "[INFO] Recuerda: aquí NO se ejecutan. Ver entorno-alumno.md §3."

      # -----------------------------------------------------------------------
      #  Ningún .sh puede llevar finales de línea de Windows.
      #
      #  Un script con CRLF NO SE EJECUTA: el intérprete lee `#!/usr/bin/env bash\r`
      #  y busca un programa llamado `bash\r`. El alumno ve esto:
      #      bash: ./bin/00-verificar.sh: /usr/bin/env: bad interpreter
      #  y se queda bloqueado el día 1, sin una pista de qué hacer.
      #
      #  El `.gitattributes` de la raíz lo previene al clonar. Este paso vigila que
      #  nadie lo degrade después — un archivo añadido desde Windows con la
      #  configuración equivocada, o un `.gitattributes` que alguien recorte.
      #
      #  Solo en ubuntu: `file` no está garantizado en el runner de Windows, y una
      #  comprobación que no corre igual en los dos sitios confunde más de lo que
      #  protege.
      # -----------------------------------------------------------------------
      - name: CRLF · ningún script puede tener finales de Windows
        if: matrix.os == 'ubuntu-latest' && steps.guarda.outputs.hay == 'si'
        shell: bash
        run: |
          set -uo pipefail
          # `grep -c` sale con 1 cuando no hay coincidencias: el `|| true` evita que
          # `set -e` mate el paso justo en el caso bueno.
          malos=$(find labs -name '*.sh' -exec file {} \; | grep -c CRLF || true)
          if [ "${malos:-0}" -gt 0 ]; then
            echo "[ERROR] Hay $malos script(s) con finales CRLF."
            echo "        En Windows, bash no puede ejecutarlos:"
            echo "        'bad interpreter: No such file or directory'."
            echo "        Revisa el .gitattributes y ejecuta: git add --renormalize ."
            find labs -name '*.sh' -exec file {} \; | grep CRLF
            exit 1
          fi
          echo "[OK] Los scripts tienen finales LF."

  # ---------------------------------------------------------------------------
  #  Deriva: que los labs no se desincronicen de su base EN SILENCIO.
  #
  #  Un `starter/`/`solucion/` se deriva de una base (el tronco, o la solución del
  #  lab anterior). Todo archivo compartido debe ser idéntico, salvo los que el lab
  #  cambia a propósito (el crimen, los huecos) — y esos están DECLARADOS en un
  #  allowlist `derivacion-*.txt`, no son excepciones ad-hoc del diff. Resuelve el
  #  hallazgo 1 de la SPEC-007: el día que el tronco cambie, esto se pone rojo.
  #
  #  No compila nada: solo compara bytes. Por eso no instala Java.
  # ---------------------------------------------------------------------------
  deriva:
    name: deriva · labs en sincronía con su base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guarda de activación
        id: guarda
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f labs/lib/verificar-toda-derivacion.sh ]; then
            echo "[INFO] Sin verificador de derivación aún: el job queda armado, no activo."
            echo "hay=no" >> "$GITHUB_OUTPUT"
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Verificar la cadena de derivación
        if: steps.guarda.outputs.hay == 'si'
        shell: bash
        run: ./labs/lib/verificar-toda-derivacion.sh

