server:
  port: 8108

spring:
  application:
    name: consolidado-ejemplo

  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

dgt:
  jwt:
    # Valor por defecto SÓLO para el perfil de laboratorio: el proyecto tiene que
    # arrancar sin configurar nada. En `prod` no hay respaldo y la aplicación se
    # niega a arrancar sin la variable — ver application-prod.yml.
    secreto: ${DGT_JWT_SECRETO:clave-de-laboratorio-que-debe-tener-32-bytes-o-mas}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: WARN
    cl.dgt: INFO
    org.springframework.boot.tomcat: INFO
    org.flywaydb: INFO
