server:
  port: 8107

spring:
  application:
    name: consolidado

  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

dgt:
  jwt:
    secreto: ${DGT_JWT_SECRETO:clave-del-proyecto-final-que-debe-tener-32-bytes-o-mas}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: WARN
    cl.dgt: INFO
    org.springframework.boot.tomcat: INFO
    org.flywaydb: INFO
