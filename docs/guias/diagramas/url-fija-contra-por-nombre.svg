<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430"
     font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3261e"/>
    </marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f37"/>
    </marker>
  </defs>
  <style>
    .caja  { fill:#fff; stroke:#333; stroke-width:2; }
    .reg   { fill:#fdf6e3; stroke:#b58900; stroke-width:2.5; }
    .muerto{ fill:#f6f6f6; stroke:#bbb; stroke-width:2; stroke-dasharray:6 4; }
    .panel { fill:none; stroke:#ccc; stroke-width:1.5; }
    .tit   { font-size:18.9px; font-weight:bold; fill:#111; text-anchor:middle; }
    .sub   { font-size:14.3px; fill:#666; text-anchor:middle; }
    .cab   { font-size:18.2px; font-weight:bold; fill:#111; }
    .cod   { font-size:16.2px; font-family:'Courier New', monospace; fill:#111; }
    .rojo  { font-size:15.6px; font-weight:bold; fill:#b3261e; }
    .verde { font-size:15.6px; font-weight:bold; fill:#1a7f37; }
    .nota  { font-size:15.0px; fill:#444; }
    .fl    { stroke:#333; stroke-width:2; fill:none; marker-end:url(#a); }
    .flr   { stroke:#b3261e; stroke-width:2.5; fill:none; marker-end:url(#ar); }
    .flv   { stroke:#1a7f37; stroke-width:2.5; fill:none; marker-end:url(#av); }
  </style>

  <!-- ============ IZQUIERDA · URL FIJA ============ -->
  <rect x="15" y="15" width="415" height="400" rx="8" class="panel"/>
  <text x="35" y="45" class="cab">EN EL LABORATORIO · una URL escrita</text>

  <rect x="35" y="62" width="360" height="30" rx="4" style="fill:#f4f4f4; stroke:#ddd;"/>
  <text x="45" y="82" class="cod">url: http://localhost:8211</text>

  <rect x="60"  y="120" width="130" height="48" rx="6" class="caja"/>
  <text x="125" y="143" class="tit">trámites</text>
  <text x="125" y="160" class="sub">tiene la dirección</text>

  <rect x="255" y="120" width="140" height="48" rx="6" class="caja"/>
  <text x="325" y="143" class="tit">contribuyentes</text>
  <text x="325" y="160" class="sub">:8211</text>

  <path d="M 195 144 L 248 144" class="fl"/>

  <text x="35" y="205" class="nota">Funciona. Y funciona bien mientras haya</text>
  <text x="35" y="222" class="nota">UNA instancia en una máquina que no cambia.</text>

  <line x1="35" y1="240" x2="410" y2="240" style="stroke:#eee; stroke-width:1.5;"/>

  <text x="35" y="266" class="rojo">El día que se mueve al 8299:</text>

  <rect x="60"  y="285" width="130" height="48" rx="6" class="caja"/>
  <text x="125" y="308" class="tit">trámites</text>
  <text x="125" y="325" class="sub">sigue diciendo 8211</text>

  <rect x="255" y="285" width="140" height="48" rx="6" class="caja"/>
  <text x="325" y="308" class="tit">contribuyentes</text>
  <text x="325" y="325" class="sub">:8299</text>

  <path d="M 195 309 L 240 309" class="flr"/>
  <text x="224" y="300" class="rojo" text-anchor="middle">✗</text>

  <text x="35" y="362" class="nota">Hay que editar la configuración de trámites,</text>
  <text x="35" y="379" class="nota">la del gateway, y reiniciar los dos.</text>
  <text x="35" y="399" class="rojo">Se toca a todo el que llama.</text>

  <!-- ============ DERECHA · POR NOMBRE ============ -->
  <rect x="470" y="15" width="415" height="400" rx="8" class="panel"/>
  <text x="490" y="45" class="cab">AQUÍ · un nombre que alguien resuelve</text>

  <rect x="490" y="62" width="360" height="30" rx="4" style="fill:#f4f4f4; stroke:#ddd;"/>
  <text x="500" y="82" class="cod">url: http://contribuyentes</text>

  <rect x="500" y="120" width="125" height="48" rx="6" class="caja"/>
  <text x="562" y="143" class="tit">trámites</text>
  <text x="562" y="160" class="sub">sabe un nombre</text>

  <rect x="712" y="120" width="140" height="48" rx="6" class="caja"/>
  <text x="782" y="143" class="tit">contribuyentes</text>
  <text x="782" y="160" class="sub">:8231</text>

  <rect x="590" y="205" width="170" height="42" rx="6" class="reg"/>
  <text x="675" y="231" class="tit">REGISTRO</text>

  <path d="M 545 175 L 600 200" class="fl"/>
  <path d="M 800 175 L 750 200" class="fl"/>
  <text x="675" y="191" class="sub">los dos le hablan</text>

  <path d="M 630 144 L 705 144" class="flv"/>

  <line x1="490" y1="270" x2="865" y2="270" style="stroke:#eee; stroke-width:1.5;"/>

  <text x="490" y="296" class="verde">El día que se mueve al 8299:</text>

  <rect x="500" y="315" width="125" height="48" rx="6" class="caja"/>
  <text x="562" y="338" class="tit">trámites</text>
  <text x="562" y="355" class="sub">NO SE TOCA</text>

  <rect x="712" y="315" width="140" height="48" rx="6" class="caja"/>
  <text x="782" y="338" class="tit">contribuyentes</text>
  <text x="782" y="355" class="sub">:8299</text>

  <path d="M 630 339 L 705 339" class="flv"/>
  <text x="667" y="331" class="verde" text-anchor="middle">✓</text>

  <text x="490" y="392" class="nota">Se reinicia el que se movió. Los demás lo</text>
  <text x="490" y="409" class="nota">encuentran solos — medido: 5 s.</text>
</svg>
