# =============================================================================
#  application.yml — configuración de dgt-tramites-api
# -----------------------------------------------------------------------------
#  Aquí NO hay credenciales. Ninguna. Ni de desarrollo ni de producción.
#  El DataSource lo cablea `spring-boot-docker-compose` a partir de compose.yaml
#  (que lleva su credencial de laboratorio, documentada y desechable).
#
#  En producción, las credenciales llegan por variable de entorno o por un
#  gestor de secretos — jamás por este archivo. Ese es el crimen del Lab 01.
# =============================================================================
spring:
  application:
    name: dgt-tramites-api

  docker:
    compose:
      enabled: true
      lifecycle-management: start_and_stop

  jpa:
    open-in-view: false          # el famoso OSIV: apagado desde el día uno
    hibernate:
      ddl-auto: validate         # el esquema lo manda Flyway, no Hibernate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    cl.dgt.tramites: INFO
